name: Publish to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # npm OIDC trusted publishing requires npm >= 11.5.1 (Node 20 ships ~10.x).
      # With trusted publishers configured per-package on npmjs.com, `npm publish`
      # authenticates via the workflow's id-token (no NPM_TOKEN needed).
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install
      - name: Sync README to packages
        run: bun run sync-readme
      - run: bun run build
      # Run package tests only (root tests are slower and tested in CI workflow)
      - run: bun run test:packages

      # Strip "bun" export condition from packages before publishing.
      # The "bun" condition points to src/*.ts which isn't in the npm tarball.
      - name: Strip bun export conditions for npm
        run: node scripts/strip-bun-exports.js

      # Publish in dependency order: tx (library: types + core + test utils) -> tx-agent-sdk -> tx-cli
      - name: Publish @jamesaphoenix/tx
        working-directory: packages/core
        run: npm publish --provenance --access public

      - name: Publish @jamesaphoenix/tx-agent-sdk
        working-directory: apps/agent-sdk
        run: npm publish --provenance --access public

      # tx-cli now bundles the MCP server (bin: tx-mcp) and API server (bin: tx-api)
      - name: Publish @jamesaphoenix/tx-cli
        working-directory: apps/cli
        run: npm publish --provenance --access public

      # Restore original package.json files (clean git state)
      - name: Restore bun export conditions
        if: always()
        run: node scripts/strip-bun-exports.js --restore
